<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitBuddy — AI Fitness Planner</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="badge">AI FITNESS PLANNER</div>
    <h1>Build a plan that fits your goal.</h1>
    <p>Generate a personalized 7-day workout routine and a practical nutrition or recovery tip.</p>
  </section>

  <section class="card">
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form action="/generate-workout" method="post" class="grid">
      <label>Name<input name="name" required minlength="2" maxlength="120" placeholder="Your name"></label>
      <label>User ID<input name="user_id" required pattern="[A-Za-z0-9_-]+" placeholder="e.g. user001"></label>
      <label>Age<input name="age" type="number" min="13" max="100" required></label>
      <label>Weight (kg)<input name="weight" type="number" min="20" max="500" step="0.1" required></label>
      <label>Fitness goal
        <select name="goal" required>
          <option value="weight loss">Weight loss</option>
          <option value="muscle gain">Muscle gain</option>
          <option value="general wellness">General wellness</option>
          <option value="flexibility">Flexibility</option>
        </select>
      </label>
      <label>Workout intensity
        <select name="intensity" required>
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <button class="primary full" type="submit">Generate 7-Day Plan</button>
    </form>
  </section>

  <footer><a href="/view-all-users">Admin / Coach dashboard</a> · <a href="/docs">API docs</a></footer>
</main>
</body>
</html>
